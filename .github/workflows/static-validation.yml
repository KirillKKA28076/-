name: Static validation

on:
  push:
    branches:
      - main
      - "repair/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-validator.txt

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r Tools/requirements-validator.txt

      - name: Validate repository
        run: python Tools/validate_project.py
